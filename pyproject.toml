[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sab-agent"
version = "0.1.0"
description = "SAB Agent - OpenAI 兼容 ChatModel 协议层"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
]

[tool.setuptools.packages.find]
where = ["src"]
